{% extends "base.html" %}
{% block hero_text %}Capítulo da documentação técnica renderizado diretamente a partir dos arquivos Markdown do projeto.{% endblock %}
{% block content %}
<section class="panel markdown-panel">
  <article id="markdown-root" class="markdown-body"></article>
</section>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const markdown = {{ markdown_content | tojson }};
  const root = document.getElementById('markdown-root');

  marked.setOptions({
    gfm: true,
    breaks: false,
  });

  root.innerHTML = marked.parse(markdown);

  root.querySelectorAll('pre code.language-mermaid').forEach((codeBlock) => {
    const pre = codeBlock.parentElement;
    const container = document.createElement('div');
    container.className = 'mermaid';
    container.textContent = codeBlock.textContent || '';
    pre.replaceWith(container);
  });

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
  });

  await mermaid.run({
    nodes: root.querySelectorAll('.mermaid'),
  });

  window.initializeSortableTables(root);
</script>
{% endblock %}
